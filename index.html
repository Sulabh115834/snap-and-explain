<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snap &amp; Explain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14283C; --paper: #F7FAFB; --teal: #0E7C74; --teal-dk: #0A5C56;
    --warn: #FFE7A8; --warn-ink: #6B4200; --line: #D3DEE3;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 18px/1.5 "Source Sans 3", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font: 800 clamp(2.2rem, 9vw, 3.2rem)/1 "Bricolage Grotesque", sans-serif; margin: 0 0 8px; letter-spacing: -0.02em; }
  .sub { margin: 0 0 24px; max-width: 34ch; }
  .snap { display: block; width: 100%; padding: 22px; border-radius: 999px; background: var(--teal); color: #fff;
          font: 800 1.3rem "Bricolage Grotesque", sans-serif; text-align: center; cursor: pointer; border: 0; }
  .snap:hover, .snap:focus-visible { background: var(--teal-dk); outline: 3px solid var(--ink); outline-offset: 3px; }
  input[type=file] { position: absolute; opacity: 0; pointer-events: none; }
  #preview { display: none; width: 100%; max-height: 260px; object-fit: cover; border-radius: 16px; margin-top: 20px; border: 1px solid var(--line); }
  #status { margin: 20px 0 0; font-weight: 600; min-height: 1.5em; }
  .card { display: none; margin-top: 16px; border: 2px solid var(--ink); border-radius: 16px; overflow: hidden; background: #fff; }
  .card h2 { margin: 0; padding: 14px 18px; background: var(--ink); color: #fff; font: 800 1.4rem "Bricolage Grotesque", sans-serif; }
  .row { padding: 14px 18px; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row b { display: block; font-size: 0.95rem; color: var(--teal-dk); }
  .row.warn { background: var(--warn); color: var(--warn-ink); }
  .row.warn b { color: var(--warn-ink); }
  .fine { font-size: 0.9rem; padding: 12px 18px; background: var(--paper); border-top: 1px solid var(--line); }
  .disclaimer { margin-top: 28px; font-size: 0.9rem; max-width: 46ch; }
  @media (prefers-reduced-motion: no-preference) { .card { animation: up .25s ease-out; } @keyframes up { from { opacity: 0; transform: translateY(8px); } } }
</style>
</head>
<body>
<main>
  <h1>Snap &amp; Explain</h1>
  <p class="sub">Take a photo of your pill bottle or blister pack. Get a plain-language summary.</p>

  <label class="snap" for="cam" tabindex="0" role="button">Take a photo</label>
  <input id="cam" type="file" accept="image/*" capture="environment">
  <img id="preview" alt="Your photo">
  <p id="status" role="status" aria-live="polite"></p>

  <section class="card" id="card" aria-live="polite">
    <h2 id="name"></h2>
    <div class="row"><b>What it is</b><span id="what"></span></div>
    <div class="row"><b>How to take it</b><span id="how"></span></div>
    <div class="row warn"><b>Key warning</b><span id="warn"></span></div>
    <div class="fine" id="fine"></div>
  </section>

  <p class="disclaimer">This is a reading aid, not medical advice. It can make mistakes. Check with your pharmacist or doctor before changing how you take any medicine.</p>
</main>

<script>
const $ = id => document.getElementById(id);
$("cam").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;
  $("card").style.display = "none";
  $("status").textContent = "Reading the label…";
  try {
    const dataUrl = await shrink(file, 1280);
    $("preview").src = dataUrl; $("preview").style.display = "block";
    const r = await fetch("/api/identify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ image: dataUrl }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    show(d);
  } catch (err) { $("status").textContent = err.message || "Something went wrong. Try again."; }
});

function show(d) {
  if (!d.identified) {
    $("status").textContent = "Couldn't identify this one. Retake with the label in focus, or ask a pharmacist.";
    return;
  }
  $("status").textContent = "";
  $("name").textContent = d.name;
  $("what").textContent = d.what_it_is;
  $("how").textContent = d.how_to_take;
  $("warn").textContent = d.key_warning;
  $("fine").textContent = d.confidence === "high"
    ? "Read from the label: " + d.read_from_label
    : "Low certainty. Confirm with a pharmacist. Text I could read: " + d.read_from_label;
  $("card").style.display = "block";
}

function shrink(file, max) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * s; c.height = img.height * s;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => rej(new Error("Couldn't open that image."));
    img.src = URL.createObjectURL(file);
  });
}
$("cam").parentElement; document.querySelector(".snap").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("cam").click(); } });
</script>
</body>
</html>
